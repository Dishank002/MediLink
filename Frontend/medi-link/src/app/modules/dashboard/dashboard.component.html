<nav class="navbar dashboard-navbar">
  <div class="container-fluid navbar-flex">
    <a class="navbar-logo" href="#">
      <img src="../../../assets/images/MediLink-Logo.png" alt="MediLink">

      <div class="profile-icon" (click)="toggleProfileMenu()">

  <div class="sidebar" [class.collapsed]="isCollapsed">

      <li><span class="icon">🏠</span><span class="menu-text">Add Doctor</span></li>
      <li><span class="icon">📄</span><span class="menu-text">Add Lab Assistant</span></li>
      <li><span class="icon">⚙️</span><span class="menu-text">Settings</span></li>
    </ul>
    <button class="sidebar-toggle-btn" (click)="toggleSidebar()">
    {{ isCollapsed ? '>' : '<' }}
  </button>
  </div>

  <div class="content">
    <table border="1px" cellspacing="0" cellpadding="5" style="width: 100%;">
      <thead>
        <tr>
          <th>Column 1</th>

        </tr>
      </thead>
      <tbody>
        <tr>
